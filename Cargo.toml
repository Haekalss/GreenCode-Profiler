[package]
name = "greenprofiler"
version = "1.9.0"
edition = "2021"
authors = ["Muhamad Haekal Syukur <haekal@greenprofiler.org>"]
description = "Universal Process-Level Energy & Code Quality Profiler in Rust (Zero-Cost Abstraction & Low-Overhead)"
license = "MIT"
repository = "https://github.com/greenprofiler/greenprofiler"

[[bin]]
name = "greenprofiler"
path = "src/main.rs"

[[bin]]
name = "gp"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
